name: Build NEXAP preview APK

on:
  push:
    branches: [main]
    paths:
      - "android-preview/**"
      - ".github/workflows/build-nexap-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-preview
        run: gradle --no-daemon assembleDebug

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXAP-preview-APK
          path: android-preview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
